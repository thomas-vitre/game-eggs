name: Traduction en Français (Gemini API)

on:
  # Permet de déclencher le workflow manuellement depuis l'onglet "Actions" de GitHub
  workflow_dispatch: 

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      # Nécessaire pour permettre au bot de pousser les modifications
      contents: write 

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Exécution du script de traduction
        env:
          # Le secret doit être configuré dans les paramètres du dépôt
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/translate_gemini.py

      - name: Commit et Push des changements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🌍 trad: traduction des fichiers .md et descriptions .json en français via Gemini"
          branch: main
          file_pattern: '*.md *.json'
