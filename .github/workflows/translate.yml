name: Global Translation with Gemini

on:
  workflow_dispatch: # Déclenchement manuel uniquement pour éviter de tout retraduire à chaque push

jobs:
  translate-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Gemini Library
        run: pip install -q -U google-generativeai

      - name: Run Global Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/translate_all.py

      - name: Commit and Push
        run: |
          git config --global user.name "Gemini Translator"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Traduction complète du dépôt par Gemini" || echo "Aucun changement"
          git push
